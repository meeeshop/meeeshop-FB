name: meeeshop-FB Daily Automated Facebook Feed & Reels Publisher

on:
  schedule:
    # Runs daily at 09:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  publish-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt Secrets & Execute Facebook Posting Workflow
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          python scripts/post_daily_fb.py
